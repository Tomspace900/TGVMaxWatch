name: collect

on:
  # Le dataset est publie vers 04h20 UTC. Deux passages laissent de la marge :
  # le cron GitHub est frequemment retarde et parfois saute sous charge.
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Les deux executions quotidiennes ne doivent jamais commiter en meme temps.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: Collecte
        run: node src/collect.ts

      # `always()` : meme si la collecte a echoue en route, ce qui est sur le
      # disque est commite. Puis, seulement s'il y avait du neuf, le telephone
      # est reveille : la donnee est deja lisible quand il vient la chercher.
      - name: Commit
        if: always()
        env:
          # Le jeton de notification est public dans le depot : le reveil est
          # signe pour que seul ce collecteur puisse toucher l'appareil.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'tgvmax-watch bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Ni reservations ni suivis ici : ils vivent sur l'appareil.
          git add data

          if git diff --cached --quiet; then
            echo 'Aucun changement, donnee deja a jour.'
            exit 0
          fi

          # [skip ci] est une ceinture : un push fait avec le GITHUB_TOKEN par
          # defaut ne redeclenche de toute facon aucun workflow.
          git commit -m "data: collecte du $(date -u +%F) [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          node src/wake.ts
