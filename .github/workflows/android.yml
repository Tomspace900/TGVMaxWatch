name: android

# Declenchement manuel uniquement : un build EAS consomme du quota, et rien
# dans ce projet ne justifie d'en lancer un a chaque commit.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profil EAS
        type: choice
        default: preview
        options: [preview, development]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verifications
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

      # Le bundle Metro est verifie ici plutot que sur les serveurs d'Expo : une
      # erreur de resolution se voit en trente secondes au lieu d'echouer au
      # bout de dix minutes de build.
      - name: Bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/export

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `--output` n'existe que pour les builds locaux : un build cloud se
      # recupere par l'URL de son artefact, que `--json` expose.
      - name: Build APK
        id: build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait \
            --json > "$RUNNER_TEMP/build.json"

          url=$(jq -r '[.. | objects | .applicationArchiveUrl? // empty] | first' "$RUNNER_TEMP/build.json")
          page=$(jq -r '[.. | objects | .id? // empty] | first' "$RUNNER_TEMP/build.json")

          test -n "$url" && test "$url" != "null"
          curl -fsSL "$url" -o "$RUNNER_TEMP/tgvmax.apk"
          echo "page=$page" >> "$GITHUB_OUTPUT"

      # La page d'installation EAS est plus commode que l'artefact : elle
      # s'ouvre au telephone et installe directement, sans dezippage.
      - name: Lien d'installation
        if: always()
        run: |
          echo "Page d'installation : https://expo.dev/accounts/tomspace900/projects/tgvmax-watch/builds/${{ steps.build.outputs.page }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tgvmax-${{ inputs.profile }}-apk
          path: ${{ runner.temp }}/tgvmax.apk
          if-no-files-found: error
