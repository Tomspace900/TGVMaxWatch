name: android

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Le SDK Android est preinstalle sur le runner ; seul le JDK est a poser.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Les JSON empaquetes ne servent qu'au tout premier lancement hors ligne :
      # l'application native lit ensuite GitHub Pages. Ils doivent quand meme
      # etre presents, sinon le build Vite echoue sur des fichiers absents.
      - name: Copie des donnees
        run: node scripts/sync-data.ts

      - name: Build web et synchronisation Capacitor
        working-directory: web
        run: |
          npm ci
          npm run build:android

      - name: APK de debogage
        working-directory: web/android
        run: ./gradlew --no-daemon assembleDebug

      # Signe avec la cle de debogage : installable par sideload, pas
      # publiable. La signature de release viendra avec la distribution.
      - uses: actions/upload-artifact@v4
        with:
          name: tgvmax-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
