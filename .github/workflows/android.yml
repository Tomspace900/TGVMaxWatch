name: android

# Declenchement manuel uniquement : un build EAS consomme du quota, et rien
# dans ce projet ne justifie d'en lancer un a chaque commit.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profil EAS
        type: choice
        default: preview
        options: [preview, development]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verifications
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

      # Le bundle Metro est verifie ici plutot que sur les serveurs d'Expo : une
      # erreur de resolution se voit en trente secondes au lieu d'echouer au
      # bout de dix minutes de build.
      - name: Bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/export

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Lie le depot au projet EAS. Un role Developer suffit a le creer, et
      # l'operation est sans effet quand le projet existe deja. Tant que
      # `extra.eas.projectId` n'est pas commite, cette etape est ce qui evite
      # un « EAS project not configured ».
      - name: Lier le projet EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init --force --non-interactive
          echo "projectId=$(node -p "require('./app.json').expo.extra.eas.projectId")" >> "$GITHUB_OUTPUT"
        id: link

      - name: Build APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait \
            --output "$RUNNER_TEMP/tgvmax.apk"

      - name: Rappel du projectId
        if: always()
        run: |
          echo "projectId a commiter dans mobile/app.json : ${{ steps.link.outputs.projectId }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tgvmax-${{ inputs.profile }}-apk
          path: ${{ runner.temp }}/tgvmax.apk
          if-no-files-found: error
