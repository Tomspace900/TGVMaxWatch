name: remind

on:
  # Vise le milieu de matinee a Paris, tres en amont de l'echeance de 17h.
  # Les executions planifiees de ce depot partent avec trois a cinq heures de
  # retard : viser 16h faisait arriver le rappel a 20h, et src/remind.ts le
  # refusait. On vise donc tot, et c'est la fenetre cote code qui tranche.
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: Rappel de confirmation
        run: node src/remind.ts
        env:
          # Le jeton de notification est public dans le depot : la requete est
          # signee pour que seul ce collecteur puisse pousser vers l'appareil.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'tgvmax-watch bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "data: rappel du $(date -u +%F) [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
