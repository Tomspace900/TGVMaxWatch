name: deploy

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `ref` explicite : appele depuis collect.yml, `github.sha` pointe sur le
      # commit d'avant le push du bot, et on deploierait des donnees perimees.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Copie des donnees dans le site
        run: node scripts/sync-data.ts

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      # `enablement` active Pages a la premiere execution, ce qui evite un
      # reglage manuel dans Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
