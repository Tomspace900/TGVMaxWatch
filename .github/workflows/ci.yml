name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Job separe, sans les dependances de la racine : c'est la seule facon de
  # verifier que le front ne depend de rien du collecteur. TypeScript remonte
  # l'arborescence pour trouver des @types, et un typecheck lance depuis un
  # poste ou la racine est installee ne voit donc pas la difference.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/sync-data.ts
      - working-directory: web
        run: |
          npm ci
          npm run build

      # Les gestes ne se verifient qu'au toucher reel : `touch-action` n'agit
      # ni sur la souris ni sur des evenements synthetiques. Une regression ici
      # ne se decouvre autrement que sur un telephone, apres coup.
      - name: Gestes
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          until curl -sSf http://localhost:4173/TGVMaxWatch/ > /dev/null; do sleep 1; done
          npm run test:gestures
