name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Job separe, sans les dependances de la racine : l'application ne doit
  # dependre de rien du collecteur en dehors des modules purs partages, et
  # seul un environnement ou la racine n'est pas installee peut le prouver.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - working-directory: mobile
        run: |
          npm ci
          npm run typecheck

      # Le bundle Metro est la seule verification qui attrape une resolution
      # cassee vers les modules partages, qui vivent hors du dossier du projet.
      - name: Bundle Android
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/export
