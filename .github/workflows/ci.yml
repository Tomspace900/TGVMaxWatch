name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Job separe, sans les dependances de la racine : c'est la seule facon de
  # verifier que le front ne depend de rien du collecteur. TypeScript remonte
  # l'arborescence pour trouver des @types, et un typecheck lance depuis un
  # poste ou la racine est installee ne voit donc pas la difference.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/sync-data.ts
      - working-directory: web
        run: |
          npm ci
          npm run build
