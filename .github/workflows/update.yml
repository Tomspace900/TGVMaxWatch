name: update

# Publication d'une mise a jour OTA. C'est le chemin normal pour tout ce qui
# n'est pas natif : quelques centaines de kilo-octets au lieu des ~100 Mo d'un
# APK, appliques au redemarrage de l'application. Un nouveau build n'est
# necessaire que si les dependances natives changent — et la politique
# `fingerprint` s'en apercoit toute seule.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  # `ci.yml` tourne sur le meme push, mais en parallele : sans ce prealable, une
  # mise a jour partait sur le telephone avant que les tests n'aient dit quoi que
  # ce soit, et n'etait rattrapable que par une autre mise a jour. Une erreur de
  # resolution, elle, est deja attrapee par `eas update`, qui bundle avant de
  # publier.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - working-directory: mobile
        run: |
          npm ci
          npm run typecheck

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Le message passe par l'environnement, jamais par `${{ }}` dans le `run`.
      # Une expression y est substituee **textuellement avant que bash ne lise
      # la ligne** : les accents graves dont ce depot parseme ses messages de
      # commit deviennent des substitutions de commande — un accent grave ouvrant
      # sur un chevron a suffi a produire une erreur de syntaxe, un code 2, et
      # une mise a jour
      # jamais publiee, pendant que `ci` restait vert. C'est aussi une porte
      # d'injection : une variable d'environnement, elle, n'est pas relue par le
      # shell.
      #
      # Seule la premiere ligne part : le sujet est ce qui identifie une mise a
      # jour dans la liste EAS, un corps de quarante lignes n'y est que du bruit.
      - name: Publier la mise a jour
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
          [ -n "$MESSAGE" ] || MESSAGE='mise a jour manuelle'
          eas update \
            --channel preview \
            --environment preview \
            --message "$MESSAGE" \
            --non-interactive
